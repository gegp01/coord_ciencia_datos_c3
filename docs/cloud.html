<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nube de Palabras - C3</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            flex-direction: column;
            background-color: var(--bg-gradient, #f8f9fa);
        }

        .header-title {
            text-align: center;
            color: var(--unam-blue);
            margin-bottom: 20px;
            z-index: 1000;
        }

        #cloud-container {
            position: relative;
            /* Tamaño dinámico que se ajusta a la ventana usando vmin */
            width: 70vmin;
            height: 70vmin;
        }

        .tag {
            position: absolute;
            font-weight: 700;
            color: var(--unam-blue);
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: color 0.3s;
            user-select: none;
            top: 0;
            left: 0;
            transform-origin: center center;
        }

        .tag:hover {
            color: var(--unam-gold);
            text-shadow: 0 0 10px rgba(213, 159, 15, 0.5);
            z-index: 9999 !important;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        /* Controles inferiores */
        .controls-panel {
            position: absolute;
            bottom: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            border: 1px solid var(--card-border, #ccc);
        }

        .controls-panel .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .controls-panel label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--unam-blue);
            font-weight: 600;
            cursor: pointer;
        }

        .controls-panel input[type="range"] {
            cursor: pointer;
            width: 120px;
        }

        @media (max-width: 768px) {
            .controls-panel {
                bottom: 10px;
                padding: 10px;
                gap: 10px;
            }
            .controls-panel input[type="range"] {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-unam action-link back-button">← Volver al Inicio</a>

    <div class="header-title">
        <h2>Conceptos de Investigación</h2>
    </div>

    <div id="cloud-container"></div>

    <div class="controls-panel">
        <div class="control-group">
            <label>
                <input type="checkbox" id="toggleCloudRot" checked> Rotar Nube
            </label>
            <label>
                Velocidad: 
                <input type="range" id="cloudSpeed" min="0.001" max="0.02" step="0.001" value="0.005">
            </label>
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="toggleWordSpin" checked> Girar Palabras
            </label>
            <label>
                Velocidad: 
                <input type="range" id="wordSpeed" min="0.1" max="5" step="0.1" value="1.5">
            </label>
        </div>
    </div>

    <script>
        const texts = [
            "Ciencia de Datos", "Big Data", "Ciencias de la Complejidad",
            "Múltiples Escalas", "Múltiples Dimensiones", "Criticalidad",
            "Interdisciplina", "Redes", "Cómputo de Alto Rendimiento",
            "Inteligencia Artificial", "Large Language Models",
            "Sistemas Dinámicos", "Algoritmos", "Modelación Computacional",
            "Machine Learning", "Análisis de Datos"
        ];

        const container = document.getElementById('cloud-container');
        let radius = container.offsetWidth / 2;
        let baseFontSize = Math.max(12, window.innerWidth / 70); 
        const tags = [];
        
        let mouseX = 0;
        let mouseY = 0;

        // Variables de estado de los controles
        let isCloudRotating = true;
        let cloudSpeedVal = 0.005;
        let isWordSpinning = true;
        let wordSpeedMultiplier = 1.5;

        // Asignar listeners a los controles
        document.getElementById('toggleCloudRot').addEventListener('change', (e) => isCloudRotating = e.target.checked);
        document.getElementById('cloudSpeed').addEventListener('input', (e) => cloudSpeedVal = parseFloat(e.target.value));
        document.getElementById('toggleWordSpin').addEventListener('change', (e) => isWordSpinning = e.target.checked);
        document.getElementById('wordSpeed').addEventListener('input', (e) => wordSpeedMultiplier = parseFloat(e.target.value));

        // Crear las etiquetas HTML
        for (let i = 0; i < texts.length; i++) {
            const el = document.createElement('div');
            el.className = 'tag';
            el.innerText = texts[i];
            container.appendChild(el);

            const phi = Math.acos(-1 + (2 * i) / texts.length);
            const theta = Math.sqrt(texts.length * Math.PI) * phi;

            tags.push({
                el: el,
                x: radius * Math.cos(theta) * Math.sin(phi),
                y: radius * Math.sin(theta) * Math.sin(phi),
                z: radius * Math.cos(phi),
                spinAngle: Math.random() * 360,
                // Dirección de giro base aleatoria (entre -1 y 1)
                baseSpinDir: (Math.random() - 0.5) * 2 
            });
        }

        // Interactividad con el mouse
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            mouseX = (e.clientX - rect.left - radius) / radius;
            mouseY = (e.clientY - rect.top - radius) / radius;
        });

        container.addEventListener('mouseleave', () => {
            mouseX = 0;
            mouseY = 0;
        });

        // Loop de animación
        function animate() {
            // Velocidad actual de la nube
            const currentCloudSpeed = isCloudRotating ? cloudSpeedVal : 0;
            
            // Ángulos de rotación basados en el mouse
            const angleY = (mouseX || 0.4) * currentCloudSpeed;
            const angleX = -(mouseY || 0.4) * currentCloudSpeed;

            const cosY = Math.cos(angleY);
            const sinY = Math.sin(angleY);
            const cosX = Math.cos(angleX);
            const sinX = Math.sin(angleX);

            tags.forEach(tag => {
                // Rotar nube (si currentCloudSpeed > 0)
                if (currentCloudSpeed !== 0) {
                    const x1 = tag.x * cosY - tag.z * sinY;
                    const z1 = tag.z * cosY + tag.x * sinY;
                    const y2 = tag.y * cosX - z1 * sinX;
                    const z2 = z1 * cosX + tag.y * sinX;

                    tag.x = x1;
                    tag.y = y2;
                    tag.z = z2;
                }

                // Rotar palabra sobre sí misma
                if (isWordSpinning) {
                    tag.spinAngle += tag.baseSpinDir * wordSpeedMultiplier;
                }

                // Proyectar
                const perspective = 800;
                const scale = perspective / (perspective - tag.z); 
                const alpha = (tag.z + radius) / (2 * radius);
                
                const left = tag.x + radius - tag.el.offsetWidth / 2;
                const top = tag.y + radius - tag.el.offsetHeight / 2;
                
                tag.el.style.transform = `translate(${left}px, ${top}px) scale(${scale}) rotate(${tag.spinAngle}deg)`;
                tag.el.style.opacity = 0.2 + (alpha * 0.8);
                tag.el.style.zIndex = Math.round(tag.z + radius);
                tag.el.style.fontSize = `${baseFontSize}px`;
            });

            requestAnimationFrame(animate);
        }

        // Redimensionamiento
        window.addEventListener('resize', () => {
            // Actualizar posiciones base de la nube al tamaño de ventana actual
            const oldRadius = radius;
            radius = container.offsetWidth / 2;
            const ratio = radius / oldRadius;
            
            tags.forEach(tag => {
                tag.x *= ratio;
                tag.y *= ratio;
                tag.z *= ratio;
            });
            
            baseFontSize = Math.max(12, window.innerWidth / 70);
        });

        // Iniciar
        animate();
    </script>
</body>
</html>

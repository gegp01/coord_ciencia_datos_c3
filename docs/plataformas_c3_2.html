<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataformas del Centro de Ciencias de la Complejidad, C3-UNAM. Exploración y herramientas digitales.">
  <meta name="theme-color" content="#0f172a">
  <title>Plataformas - C3</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Deep space dark theme */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(99, 102, 241, 0.2);
      --card-hover-border: rgba(99, 102, 241, 0.8);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --highlight: #818cf8;
      --max-width: 1200px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Container for content */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 60px 20px;
    }

    /* Header styling */
    .page-header {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeInDown 0.8s ease-out;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Grid Layout */
    .plataformas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.3s forwards;
    }

    /* Card Styling - Glassmorphism touch */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  box-shadow 0.4s ease, border-color 0.4s ease;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--highlight));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
      z-index: 1;
    }

    .card:hover, .card:focus-within {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border-color: var(--card-hover-border);
    }

    .card:hover::before, .card:focus-within::before {
      transform: scaleX(1);
    }

    /* Card Image Area */
    .card-img-wrapper {
      height: 180px;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .card-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
      transition: transform 0.4s ease;
    }

    .card:hover .card-img, .card:focus-within .card-img {
      transform: scale(1.08);
    }

    /* Card Content Area */
    .card-content {
      padding: 25px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .leer-mas-btn {
      align-self: flex-start;
      color: var(--accent);
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s ease;
    }

    .leer-mas-btn:hover, .leer-mas-btn:focus-visible {
      color: var(--highlight);
      outline: none;
    }

    .leer-mas-btn:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .leer-mas-btn::after {
      content: '→';
      transition: transform 0.2s ease;
    }

    .leer-mas-btn.expanded::after {
      content: '↑';
    }

    .card-footer {
      padding: 20px 25px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(15, 23, 42, 0.3);
      display: flex;
      justify-content: flex-end; /* Align right */
      align-items: center;
    }

    .action-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    .action-link:hover, .action-link:focus-visible {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      outline: none;
    }

    .action-link svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .container { padding: 40px 15px; }
      .plataformas-grid {
        grid-template-columns: 1fr;
        max-width: 450px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <header class="page-header">
      <h1>Plataformas del C3</h1>
      <p>
        Explora las herramientas digitales y laboratorios virtuales desarrollados en el Centro de Ciencias de la Complejidad.
      </p>
    </header>

    <section id="plataformas-grid" class="plataformas-grid" aria-label="Lista de plataformas"></section>
  </main>

  <script>
    // Data definition
    const plataformasData = [
      {
        nombre: "Chilam",
        descripcion: "El objetivo del laboratorio Chilam es recopilar e integrar grandes conjuntos datos de diversas fuentes que abarquen muchas disciplinas. Así como la construcción de laboratorios virtuales que permitan analizar este gran conjunto de datos, simular sistemas complejos adaptativos, y diseñar experimentos virtuales para probar hipótesis. Estos análisis permitirán apoyar en la solución de problemas globales en salud, bienestar social y sustentabilidad.",
        url: "https://chilam.c3.unam.mx/",
        imagen_url: "logos_plataformas/chilam.png"
      },
      {
        nombre: "Conductome",
        descripcion: "Proyecto de investigación que identifica y analiza las relaciones causales entre factores que influyen en la conducta humana vinculada a la obesidad con el objetivo de construir un modelo mental, que abarca conceptos como creencias, percepción de sí mismo y del mundo.",
        url: "https://chilam.c3.unam.mx/proyectos/conductome",
        imagen_url: "logos_plataformas/conductome.svg"
      },
      {
        nombre: "Dyana",
        descripcion: "DyAna es un laboratorio virtual que permite analizar bases de datos complejas de forma intuitiva y segura. Su principal ventaja es que facilita la generación de conocimiento sin requerir conocimientos de programación, integrando información de diversos sectores para el estudio de sistemas biológicos y sociales.",
        url: "https://dyana.c3.unam.mx",
        imagen_url: "logos_plataformas/logo_dyana_lb.svg"
      },
      {
        nombre: "EpI-PUMA",
        descripcion: "En síntesis, un usuario podrá crear rápidamente su propio modelo predictivo centrado en una predicción vinculada a una decisión en un ambiente amigable donde no se requiere conocimientos especializados, ni de modelación ni de aprendizaje de máquinas.",
        url: "https://chilam.c3.unam.mx/proy-epipuma/acerca-de-epipuma",
        imagen_url: "logos_plataformas/epipuma.svg"
      },
      {
        nombre: "EPI-SPECIES",
        descripcion: "Determinar y caracterizar el paisaje epidemiológico donde se desarrolla una zoonosis, es el primer paso para entender su complejidad. Este conocimiento es fundamental para la predicción de futuros riesgos, ya que nos permite crear escenarios.",
        url: "https://chilam.c3.unam.mx/proyectos/epi-species",
        imagen_url: "logos_plataformas/epispecies.svg"
      },
      {
        nombre: "LabSOM",
        descripcion: "LabSOM es una herramienta de uso libre para el análisis exploratorio de datos con la red neuronal SOM (Redes de Kohonen). Entre sus funcionalidades está la visualización de mapas de componentes, UMatrix y mapa de Clustering. La herramienta fue desarrollada en el Laboratorio de Dinámica no Lineal de la Facultad de Ciencias de la UNAM.",
        url: "https://zenodo.org/records/3630581",
        imagen_url: "logos_plataformas/labSOM.png"
      },    
      {
        nombre: "Micom-Web",
        descripcion: "Interfaz web fácil de usar para utilizar MICOM sin necesidad de escribir una sola línea de código en Python. En MICOMWeb puedes subir tus datos experimentales para construir redes metabólicas utilizando diferentes bases de datos y simular los flujos metabólicos de tu comunidad de acuerdo con una dieta determinada. MICOMWeb realizará todo el proceso y te enviará un correo electrónico una vez que se hayan completado todos los cálculos.",
        url: "https://micomweb.c3.unam.mx/",
        imagen_url: "logos_plataformas/MICOM.png"
      },
      {
        nombre: "Observatorio de Vacunas",
        descripcion: "Sistema de información para el control de la pandemia de COVID-19 mediante la promoción de la vacunación en la población de México.",
        url: "https://observatoriovacunascovid19.unam.mx/",
        imagen_url: "logos_plataformas/observatoriodevacunas.png"
      },
      {
        nombre: "PathSOM",
        descripcion: "PathSOM es una herramienta basada en redes neuronales autoorganizadas (Self-Organizing Maps, SOM) para visualizar la evolución de datos multidimensionales (trayectorias) en el plano. La herramienta fue desarrollada en el Laboratorio de Dinámica no Lineal de la Facultad de Ciencias de la UNAM.",
        url: "https://zenodo.org/records/15058998",
        imagen_url: "logos_plataformas/PathSOM_horiz_white.png"
      },    
      {
        nombre: "Proyecto 42",
        descripcion: "Es un Proyecto de investigación que nació de la necesidad de conocer más a fondo las causas del Síndrome Metabólico (hipertensión, dislipidemia, diabetes/prediabetes, obesidad) y el sobrepeso en México.",
        url: "https://chilam.c3.unam.mx/proyectos/proyecto-42",
        imagen_url: "logos_plataformas/proyecto42.svg"
      },
      {
        nombre: "SPECIES",
        descripcion: "Herramienta desarrollada por C3-UNAM y CONABIO que analiza nichos ecológicos, distribuciones potenciales e interacciones entre especies. Usa minería de datos espaciales con registros biológicos y variables ambientales para apoyar la investigación y conservación de la biodiversidad, facilitando un enfoque integral y accesible.",
        url: "https://chilam.c3.unam.mx/proy-species/acerca-de-species",
        imagen_url: "logos_plataformas/species.svg"
      }
    ];

    // SVG Icons
    const linkIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" /></svg>';

    // Constants
    const MAX_DESC_LENGTH = 120;

    // Render logic
    const gridContainer = document.getElementById('plataformas-grid');

    const renderGrid = () => {
      // Use document fragment for better performance (single DOM update)
      const fragment = document.createDocumentFragment();
      
      plataformasData.forEach((item, index) => {
        const card = document.createElement('article');
        card.classList.add('card');
        
        // Staggered animation using template literal
        card.style.animation = `fadeInDown 0.6s ease-out ${index * 0.1}s both`;

        const needsExpander = item.descripcion.length > MAX_DESC_LENGTH;
        const shortDesc = needsExpander ? `${item.descripcion.substring(0, MAX_DESC_LENGTH).trim()}...` : item.descripcion;

        const imgPlaceholder = `<div style="color: var(--text-muted); font-size: 0.9rem;">Sin imagen</div>`;
        const imgTag = item.imagen_url ? `<img src="${item.imagen_url}" alt="Logo de ${item.nombre}" class="card-img" loading="lazy">` : imgPlaceholder;

        // Cleaned up template string interpolation
        card.innerHTML = `
          <div class="card-img-wrapper">
            ${imgTag}
          </div>
          <div class="card-content">
            <h3 class="card-title">${item.nombre}</h3>
            <p class="card-desc" id="desc-${index}">${shortDesc}</p>
            ${needsExpander ? `<button type="button" class="leer-mas-btn" aria-expanded="false" aria-controls="desc-${index}" data-index="${index}">Leer más</button>` : ''}
          </div>
          <div class="card-footer">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="action-link" aria-label="Visitar sitio de ${item.nombre}">
              Visitar sitio
              ${linkIcon}
            </a>
          </div>
        `;
        
        fragment.appendChild(card);
      });

      // Clear layout and append new elements
      gridContainer.innerHTML = '';
      gridContainer.appendChild(fragment);
    };

    // Event delegation for expanding descriptions (adds only one event listener instead of multiple)
    gridContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.leer-mas-btn');
      if (!btn) return;

      const index = parseInt(btn.getAttribute('data-index'), 10);
      const isExpanded = btn.getAttribute('aria-expanded') === 'true';
      const descEl = document.getElementById(`desc-${index}`);
      
      if (!isExpanded) {
        descEl.textContent = plataformasData[index].descripcion;
        btn.textContent = 'Leer menos';
        btn.setAttribute('aria-expanded', 'true');
        btn.classList.add('expanded');
      } else {
        descEl.textContent = `${plataformasData[index].descripcion.substring(0, MAX_DESC_LENGTH).trim()}...`;
        btn.textContent = 'Leer más';
        btn.setAttribute('aria-expanded', 'false');
        btn.classList.remove('expanded');
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', renderGrid);
  </script>
</body>
</html>
